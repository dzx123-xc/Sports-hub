name: SConnect CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python -m unittest discover -s tests -p "test_repo_contract.py" -v
