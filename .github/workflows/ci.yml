name: SConnect CI

on:
  push:
    branches: [main, '**']
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q server.py database.py tests

      - name: Validate repository contract
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js && node --check dashboard.js && node --check auth-guard.js && node --check identity-sync.js && node --check profile-editor.js
